<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moved to plugins.delmaredigital.com</title>
  <link rel="canonical" href="https://plugins.delmaredigital.com/docs/page-tree">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="2; url=https://plugins.delmaredigital.com/docs/page-tree">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #222; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 36rem; padding: 2rem; text-align: center; }
    a { color: #006a80; }
    @media (prefers-color-scheme: dark) {
      body { background: #151515; color: #eee; }
      a { color: #7dd9eb; }
    }
  </style>
  <script>
    const root = 'https://plugins.delmaredigital.com/docs/page-tree';
    const anchors = {
      'features': '',
      'installation': 'installation',
      'quick-start': 'installation',
      'step-1-config': 'installation',
      'step-2-collection': 'installation',
      'step-3-routing': 'installation',
      'how-it-works': 'how-it-works',
      'tree-view': 'features/tree-view',
      'cascading-updates': 'features/cascading-updates',
      'url-history': 'features/url-history',
      'config-options': 'configuration',
      'access-control': 'access-control',
      'custom-slugs': 'guides/custom-slugs',
      'plugin-order': 'guides/plugin-order',
      'org-scoping': 'guides/organization-scoping',
      'extensibility': 'guides/extensibility',
      'existing-projects': 'guides/existing-projects',
    };
    const hash = location.hash.slice(1);
    const path = Object.prototype.hasOwnProperty.call(anchors, hash) ? anchors[hash] : '';
    location.replace(path ? `${root}/${path}` : root);
  </script>
</head>
<body>
  <main>
    <p>These docs have moved to plugins.delmaredigital.com.</p>
    <p><a href="https://plugins.delmaredigital.com/docs/page-tree">Visit the documentation</a></p>
  </main>
</body>
</html>
